[project]
name = "lanlock"
description = "Keep internal domains on DIRECT in a clashtui-managed mihomo or FlClash, and prove it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = ["ruamel.yaml>=0.18.6,<0.20"]
keywords = ["clash", "mihomo", "routing", "dns"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
test = ["pytest>=8"]

[project.scripts]
lanlock = "lanlock.cli:main"
lanlock-tui = "lanlock.cli:tui_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lanlock/__init__.py"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.py[cod]"]

[tool.hatch.build.targets.sdist]
include = ["/src/lanlock", "/tests", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/lanlock"]
